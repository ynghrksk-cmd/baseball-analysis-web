<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Baseball Motion Analysis</title>
<style>
  body { margin: 0; background: #000; color: #0f0; font-family: monospace; }
  #container { position: relative; width: 100%; }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: auto; }
  #log {
    position: relative;
    z-index: 10;
    background: rgba(0,0,0,0.8);
    padding: 8px;
    font-size: 14px;
    white-space: pre-wrap;
    min-height: 40px;
  }
</style>
</head>
<body>
<div id="log">起動中...</div>
<div id="container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output"></canvas>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const logEl = document.getElementById("log");
function log(msg) {
  logEl.textContent += "\n" + msg;
  console.log(msg);
}

const video = document.getElementById("webcam");
const canvas = document.getElementById("output");
const ctx = canvas.getContext("2d");

let poseLandmarker;
let lastVideoTime = -1;

// --- 角度計算（Python版のcalculate_angleと同じ考え方） ---
function calculateAngle(a, b, c) {
  const radians =
    Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
  let angle = Math.abs((radians * 180.0) / Math.PI);
  if (angle > 180.0) angle = 360 - angle;
  return angle;
}

// --- 2点を結ぶ線の傾き（Python版のcalculate_line_angleと同じ考え方） ---
function calculateLineAngle(a, b) {
  const radians = Math.atan2(b.y - a.y, b.x - a.x);
  let angle = Math.abs((radians * 180.0) / Math.PI);
  if (angle > 90) angle = 180 - angle;
  return angle;
}

async function createPoseLandmarker() {
  log("MediaPipeの準備を読み込み中...");
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  log("骨格検出モデルを読み込み中...");
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
  log("モデルの読み込み完了");
}

async function startCamera() {
  log("カメラへのアクセスを要求中...");
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  log("カメラのアクセス許可OK");
  video.srcObject = stream;
  return new Promise((resolve) => {
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      resolve();
    };
  });
}

function drawResults(result) {
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const drawingUtils = new DrawingUtils(ctx);

  for (const landmarks of result.landmarks) {
    drawingUtils.drawLandmarks(landmarks, { radius: 3 });
    drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS);

    // --- 各種角度を計算（Python版と同じ関節番号） ---
    const rightKnee = calculateAngle(landmarks[24], landmarks[26], landmarks[28]);
    const leftKnee = calculateAngle(landmarks[23], landmarks[25], landmarks[27]);
    const rightElbow = calculateAngle(landmarks[12], landmarks[14], landmarks[16]);
    const leftElbow = calculateAngle(landmarks[11], landmarks[13], landmarks[15]);
    const hipRotation = calculateLineAngle(landmarks[23], landmarks[24]);
    const shoulderRotation = calculateLineAngle(landmarks[11], landmarks[12]);
    const separation = Math.abs(shoulderRotation - hipRotation);
    const hipCenterX = (landmarks[23].x + landmarks[24].x) / 2;

    // --- 画面に数値を表示 ---
    ctx.font = "20px monospace";
    ctx.fillStyle = "#00ff00";
    const lines = [
      `Right Knee: ${rightKnee.toFixed(0)}`,
      `Left Knee: ${leftKnee.toFixed(0)}`,
      `Right Elbow: ${rightElbow.toFixed(0)}`,
      `Left Elbow: ${leftElbow.toFixed(0)}`,
      `Hip Rotation: ${hipRotation.toFixed(0)}`,
      `Shoulder Rotation: ${shoulderRotation.toFixed(0)}`,
      `Separation: ${separation.toFixed(0)}`,
      `Hip Center X: ${hipCenterX.toFixed(2)}`
    ];
    lines.forEach((text, i) => {
      ctx.fillText(text, 10, 30 + i * 26);
    });
  }
  ctx.restore();
}

async function renderLoop() {
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = poseLandmarker.detectForVideo(video, performance.now());
    drawResults(result);
  }
  requestAnimationFrame(renderLoop);
}

async function main() {
  try {
    await createPoseLandmarker();
    await startCamera();
    log("骨格検出を開始します");
    renderLoop();
  } catch (err) {
    log("エラー発生: " + err.message);
    console.error(err);
  }
}

main();
</script>
</body>
</html>
