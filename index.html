<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Baseball Motion Analysis</title>
<style>
  body { margin: 0; background: #000; color: #0f0; font-family: monospace; }
  #container { position: relative; width: 100%; }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: auto; }
  #log {
    position: relative;
    z-index: 10;
    background: rgba(0,0,0,0.8);
    padding: 8px;
    font-size: 14px;
    white-space: pre-wrap;
    min-height: 100px;
  }
</style>
</head>
<body>
<div id="log">起動中...</div>
<div id="container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output"></canvas>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const logEl = document.getElementById("log");
function log(msg) {
  logEl.textContent += "\n" + msg;
  console.log(msg);
}

const video = document.getElementById("webcam");
const canvas = document.getElementById("output");
const ctx = canvas.getContext("2d");

let poseLandmarker;
let lastVideoTime = -1;

async function createPoseLandmarker() {
  log("MediaPipeの準備を読み込み中...");
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  log("骨格検出モデルを読み込み中...");
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
  log("モデルの読み込み完了");
}

async function startCamera() {
  log("カメラへのアクセスを要求中...");
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  log("カメラのアクセス許可OK");
  video.srcObject = stream;
  return new Promise((resolve) => {
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      log("カメラの映像サイズ: " + video.videoWidth + "x" + video.videoHeight);
      resolve();
    };
  });
}

function drawResults(result) {
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const drawingUtils = new DrawingUtils(ctx);
  for (const landmarks of result.landmarks) {
    drawingUtils.drawLandmarks(landmarks, { radius: 3 });
    drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS);
  }
  ctx.restore();
}

async function renderLoop() {
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = poseLandmarker.detectForVideo(video, performance.now());
    drawResults(result);
  }
  requestAnimationFrame(renderLoop);
}

async function main() {
  try {
    await createPoseLandmarker();
    await startCamera();
    log("骨格検出を開始します");
    renderLoop();
  } catch (err) {
    log("エラー発生: " + err.message);
    console.error(err);
  }
}

main();
</script>
</body>
</html>
