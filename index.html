<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Baseball Motion Analysis</title>
<style>
  body { margin: 0; background: #000; color: #0f0; font-family: monospace; }
  #container { position: relative; width: 100%; }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: auto; }
  #modeButtons {
    position: relative;
    z-index: 10;
    display: flex;
    gap: 8px;
    padding: 8px;
    background: rgba(0,0,0,0.8);
  }
  .mode-btn {
    flex: 1;
    padding: 14px 0;
    font-size: 16px;
    font-family: monospace;
    border: 2px solid #0f0;
    background: #111;
    color: #0f0;
  }
  .mode-btn.active {
    background: #0f0;
    color: #000;
  }
</style>
</head>
<body>
<div id="modeButtons">
  <button class="mode-btn active" data-mode="pitching">投球</button>
  <button class="mode-btn" data-mode="batting">バッティング</button>
  <button class="mode-btn" data-mode="fielding">守備</button>
</div>
<div id="container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output"></canvas>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("webcam");
const canvas = document.getElementById("output");
const ctx = canvas.getContext("2d");

let poseLandmarker;
let lastVideoTime = -1;

// --- モード管理 ---
let currentMode = "pitching";

const MODE_FIELDS = {
  pitching: ["rightElbow", "leftElbow", "hipRotation", "shoulderRotation", "separation", "hipCenterX"],
  batting: ["hipRotation", "shoulderRotation", "separation", "hipCenterX", "rightElbow", "leftElbow"],
  fielding: ["rightKnee", "leftKnee", "hipCenterX"]
};

const FIELD_LABELS = {
  rightKnee: "Right Knee",
  leftKnee: "Left Knee",
  rightElbow: "Right Elbow",
  leftElbow: "Left Elbow",
  hipRotation: "Hip Rotation",
  shoulderRotation: "Shoulder Rotation",
  separation: "Separation",
  hipCenterX: "Hip Center X"
};

// --- モードボタンの処理 ---
document.querySelectorAll(".mode-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    currentMode = btn.dataset.mode;
    document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
  });
});

// --- 角度計算 ---
function calculateAngle(a, b, c) {
  const radians =
    Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
  let angle = Math.abs((radians * 180.0) / Math.PI);
  if (angle > 180.0) angle = 360 - angle;
  return angle;
}

function calculateLineAngle(a, b) {
  const radians = Math.atan2(b.y - a.y, b.x - a.x);
  let angle = Math.abs((radians * 180.0) / Math.PI);
  if (angle > 90) angle = 180 - angle;
  return angle;
}

async function createPoseLandmarker() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  return new Promise((resolve) => {
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      resolve();
    };
  });
}

function drawResults(result) {
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const drawingUtils = new DrawingUtils(ctx);

  for (const landmarks of result.landmarks) {
    drawingUtils.drawLandmarks(landmarks, { radius: 3 });
    drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS);

    const allValues = {
      rightKnee: calculateAngle(landmarks[24], landmarks[26], landmarks[28]),
      leftKnee: calculateAngle(landmarks[23], landmarks[25], landmarks[27]),
      rightElbow: calculateAngle(landmarks[12], landmarks[14], landmarks[16]),
      leftElbow: calculateAngle(landmarks[11], landmarks[13], landmarks[15]),
      hipRotation: calculateLineAngle(landmarks[23], landmarks[24]),
      shoulderRotation: calculateLineAngle(landmarks[11], landmarks[12])
    };
    allValues.separation = Math.abs(allValues.shoulderRotation - allValues.hipRotation);
    allValues.hipCenterX = (landmarks[23].x + landmarks[24].x) / 2;

    const activeFields = MODE_FIELDS[currentMode];

    ctx.font = "bold 32px monospace";
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#000000";
    ctx.fillStyle = "#ffffff";
    activeFields.forEach((field, i) => {
      const value = allValues[field];
      const text =
        field === "hipCenterX"
          ? `${FIELD_LABELS[field]}: ${value.toFixed(2)}`
          : `${FIELD_LABELS[field]}: ${value.toFixed(0)}`;
      const y = 40 + i * 42;
      ctx.strokeText(text, 10, y);
      ctx.fillText(text, 10, y);
    });
  }
  ctx.restore();
}

async function renderLoop() {
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = poseLandmarker.detectForVideo(video, performance.now());
    drawResults(result);
  }
  requestAnimationFrame(renderLoop);
}

async function main() {
  try {
    await createPoseLandmarker();
    await startCamera();
    renderLoop();
  } catch (err) {
    console.error(err);
  }
}

main();
</script>
</body>
</html>
